name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21

    steps:
      - uses: actions/checkout@v4
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build with Maven
        run: ./mvnw clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm -v "${PWD}:/src" semgrep/semgrep semgrep --config=auto --sarif --output results.sarif /src
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Run OWASP Dependency Check
        run: |
          mkdir -p /tmp/dc-data
          chmod 777 /tmp/dc-data
          # Запускаем проверку
          ./mvnw org.owasp:dependency-check-maven:check -DdataDirectory=/tmp/dc-data
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always() # Загружать отчет даже если проверка провалена
        with:
          name: dependency-check-report
          # Используем маску, чтобы найти файл, где бы он ни лежал в target
          path: "target/**/dependency-check-report.html"