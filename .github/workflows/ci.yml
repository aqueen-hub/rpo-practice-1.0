name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # 1. ПОИСК СЕКРЕТОВ (Остановит всё, если найдет ключи)
  secrets-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. СБОРКА (Начнется только если секретов нет)
  build:
    name: Build
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: chmod +x mvnw && ./mvnw clean package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  # 3. ПРОВЕРКА ЗАВИСИМОСТЕЙ (SCA)
  security:
    name: Dependency Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Check
        run: chmod +x mvnw && ./mvnw org.owasp:dependency-check-maven:check || true
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  # 4. ДИНАМИЧЕСКИЙ АНАЛИЗ (DAST)
  dast-baseline:
    name: ZAP Baseline Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - name: Run App in Background
        run: java -jar target/*.jar & sleep 30
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'http://localhost:8080'
          fail_action: false

  # 5. ФАЗЗИНГ-ТЕСТИРОВАНИЕ (Web Fuzzing)
  web-fuzzing:
    name: Web Fuzzing (ffuf)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - name: Run App in Background
        run: java -jar target/*.jar & sleep 30
      - name: Install ffuf
        run: |
          wget https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar -xf ffuf_2.1.0_linux_amd64.tar.gz
          sudo mv ffuf /usr/local/bin/
      - name: Create Wordlist
        run: echo -e "admin\napi\nconfig\n.env\nbackup\nsecret\ndev\nlogin" > wordlist.txt
      - name: Run Fuzzer
        run: ffuf -u http://localhost:8080/FUZZ -w wordlist.txt -mc 200,403,401 -o fuzz-results.json
      - name: Upload Fuzz Results
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-results
          path: fuzz-results.json