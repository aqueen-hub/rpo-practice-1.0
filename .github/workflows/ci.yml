name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21

    steps:
      - uses: actions/checkout@v4
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build with Maven
        run: ./mvnw clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm -v "${PWD}:/src" semgrep/semgrep semgrep --config=auto --sarif --output results.sarif /src
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        # Добавляем 'install', чтобы мавен скачал все зависимости и подготовил проект,
        # иначе плагину нечего будет проверять на чистом сервере
        run: |
          mkdir -p /tmp/dc-data
          ./mvnw install -DskipTests # Сначала собираем зависимости
          ./mvnw org.owasp:dependency-check-maven:check -DdataDirectory=/tmp/dc-data

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        # ВОТ ЭТА СТРОЧКА — СПАСЕНИЕ. Она заставит GitHub загрузить отчет, даже если билд упал
        if: always()
        with:
          name: dependency-check-report
          # Используем маску **, чтобы он нашел файл, даже если он в подпапке
          path: "target/dependency-check-report.html"