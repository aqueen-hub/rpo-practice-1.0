stages:
  - build
  - test

build:
  stage: build
  image: eclipse-temurin:21
  script:
    - chmod +x mvnw
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

dependency_check:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - chmod +x mvnw
    - ./mvnw org.owasp:dependency-check-maven:check || true
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html

semgrep:
  stage: test
  image: semgrep/semgrep
  script:
    - semgrep --config=auto --json --output results.json .
  artifacts:
    paths:
      - results.json

dast_baseline:
  stage: test
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  needs:
    - build
  script:
    - apt-get update && apt-get install -y openjdk-17-jre
    # Запускаем именно основной JAR, логи пишем в файл для отладки
    - java -jar target/*.jar > app.log 2>&1 &
    - sleep 40
    # Самое важное: добавляем || true, чтобы работа не падала из-за найденных уязвимостей
    - zap-baseline.py -t http://localhost:8080 -r report_baseline.html || true
  artifacts:
    when: always
    paths:
      - report_baseline.html
      - app.log

dast_api:
  stage: test
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  needs:
    - build
  script:
    - apt-get update && apt-get install -y openjdk-17-jre
    - java -jar target/*.jar > app.log 2>&1 &
    - sleep 40
    # Сканируем API и тоже не падаем при варнингах
    - zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -r report_api.html || true
  artifacts:
    when: always
    paths:
      - report_api.html
      - app.log