workflow:
  rules:
    # Запуск только при создании или обновлении Merge Request в ветку main
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

stages:
  - build
  - test

#cборка проекта
build-job:
  stage: build
  image: eclipse-temurin:21-jdk
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week

#статический анализ безопасности (SAST)
sast-semgrep:
  stage: test
  image: returntocorp/semgrep
  tags:
    - linux
    - bas2301
  variables:
    SEMGREP_RULES: p/security-audit p/secrets p/ci
  script:
    - semgrep scan --sarif --output report.sarif
  artifacts:
    reports:
      sast: report.sarif
    paths:
      - report.sarif
    expire_in: 1 week
